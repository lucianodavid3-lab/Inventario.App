<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0D2334">
    <title>Inventario Pro - V31 Auth</title>
    <style>
        :root {
            --navy-main: #0D2334;
            --red-accent: #D70F27;
            --bg-body: #F4F6F9;
            --bg-card: #FFFFFF;
            --text-main: #0D2334;
            --text-muted: #64748B;
            --input-bg: #E2E8F0;
            --input-text: #0D2334;
            --input-placeholder: rgba(13, 35, 52, 0.35);
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding-bottom: 40px; }

        /* --- LOGIN SCREEN --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--navy-main); display: flex; align-items: center; justify-content: center;
            z-index: 2000; padding: 20px;
        }
        .login-box {
            background: white; width: 100%; max-width: 350px; border-radius: 16px;
            padding: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .login-box h2 { color: var(--navy-main); margin-bottom: 25px; font-weight: 800; }
        
        /* --- HEADER & TABS --- */
        header { background-color: var(--navy-main); color: white; padding: 10px 16px 0 16px; position: sticky; top: 0; z-index: 100; }
        .header-top { display: grid; grid-template-columns: 60px 1fr 60px; align-items: center; margin-bottom: 10px; }
        .header-logo { height: 35px; background: white; border-radius: 4px; padding: 2px; }
        h1 { margin: 0; font-size: 18px; text-align: center; }
        .header-btn-upload { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; border-radius: 8px; width: 40px; height: 40px; cursor: pointer; }
        .tabs { display: flex; gap: 20px; justify-content: center; }
        .tab-btn { background: transparent; border: none; color: rgba(255, 255, 255, 0.6); font-size: 14px; padding-bottom: 12px; cursor: pointer; flex: 1; text-align: center; }
        .tab-btn.active { color: white; font-weight: 700; border-bottom: 4px solid var(--red-accent); }

        /* --- UI COMPONENTS --- */
        .container { padding: 16px; max-width: 600px; margin: 0 auto; }
        .view { display: none; }
        .view.active { display: block; }
        .card { background: var(--bg-card); border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 12px; }
        label { display: block; font-size: 11px; font-weight: 700; color: var(--navy-main); margin-bottom: 6px; text-transform: uppercase; }
        input { width: 100%; padding: 14px; font-size: 16px; border: none; border-radius: 8px; background-color: var(--input-bg); color: var(--input-text); margin-bottom: 15px; }
        .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-primary { background-color: var(--red-accent); color: white; }
        .btn-secondary { background-color: var(--input-bg); color: var(--navy-main); }
        .input-action-btn { position: absolute; right: 4px; top: 22px; width: 44px; height: 44px; background: var(--navy-main); color: white; border: none; border-radius: 6px; }

        /* --- TABLA --- */
        .table-wrap { overflow-x: auto; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 700px; }
        th { background: var(--navy-main); color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .status-badge { padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 800; }
        .bg-ok { background: #DCFCE7; color: #166534; }
        .bg-err { background: #FEE2E2; color: #991B1B; }

        /* --- ADMIN ONLY --- */
        .adm-only { display: none; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>INVENTARIO PRO</h2>
            <input type="text" id="login-user" placeholder="Nombre de Usuario">
            <input type="password" id="login-pass" placeholder="Contraseña">
            <button class="btn btn-primary" onclick="loginUsuario()">ENTRAR</button>
        </div>
    </div>

    <header>
        <div class="header-top">
            <button onclick="logout()" style="background:none; border:none; color:white; font-size:12px;">SALIR</button>
            <h1>INVENTARIO</h1>
            <button class="header-btn-upload adm-only" id="btn-cloud-master" onclick="downloadMasterFromCloud()">☁️</button>
        </div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchView('conteo')">CONTEO</button>
            <button class="tab-btn" onclick="switchView('historial')">HISTORIAL (<span id="count-badge">0</span>)</button>
        </div>
    </header>

    <div id="view-conteo" class="view active container">
        <div class="card">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div>
                    <label>Usuario Activo</label>
                    <input type="text" id="user-display" disabled style="background:#f0f0f0; font-weight:bold;">
                </div>
                <div>
                    <label>Zona</label>
                    <input type="text" id="zone-filter" placeholder="Prefijo">
                </div>
            </div>
            
            <div class="adm-only">
                <label>Rango Intrusos</label>
                <div style="display:grid; grid-template-columns: 1fr 1fr 80px; gap:8px;">
                    <input type="number" id="intruder-start" value="1">
                    <input type="number" id="intruder-end" value="300">
                    <button class="btn btn-navy" onclick="toggleRangeLock()" id="btn-lock-range" style="background:var(--navy-main); color:white; font-size:10px; height:48px;">FIJAR</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div style="position:relative">
                <label>Ubicación</label>
                <input type="text" id="location" placeholder="Escanear...">
                <button class="input-action-btn" onclick="startCamera('location')">📷</button>
            </div>
            <div style="position:relative">
                <label>Material</label>
                <input type="text" id="material" placeholder="Escanear...">
                <button class="input-action-btn" onclick="startCamera('material')">📷</button>
            </div>
            <label>Cantidad</label>
            <input type="number" id="qty" placeholder="0" inputmode="numeric">
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <button class="btn btn-secondary" onclick="clearForm()">LIMPIAR</button>
                <button class="btn btn-primary" onclick="validateAndSave()">GUARDAR</button>
            </div>
        </div>
    </div>

    <div id="view-historial" class="view container">
        <div class="card adm-only" style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px;">
            <button class="btn btn-secondary" onclick="exportCSV()" style="font-size:10px;">CSV</button>
            <button class="btn btn-secondary" onclick="sendByEmail()" style="font-size:10px;">MAIL</button>
            <button class="btn btn-primary" onclick="resetAllProtected()" style="font-size:10px; background:var(--danger)">BORRAR</button>
        </div>
        <div class="card" style="padding:0; overflow:hidden">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Fecha</th><th>Ubi</th><th>Material</th><th>Cant</th><th>Operario</th><th>Est</th><th></th></tr>
                    </thead>
                    <tbody id="records-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="camera-container" style="display:none; background:black; padding:10px; border-radius:12px; margin:10px;">
        <video id="video" style="width:100%; border-radius:8px;" playsinline muted autoplay></video>
        <button onclick="stopCamera()" class="btn btn-primary" style="margin-top:10px;">CERRAR CÁMARA</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
        import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDI2_dfJ5WBgCoddHPaXg40yrxEZqB4ZXI",
            authDomain: "inventarioapp-cddbe.firebaseapp.com",
            projectId: "inventarioapp-cddbe",
            storageBucket: "inventarioapp-cddbe.firebasestorage.app",
            messagingSenderId: "1091506863615",
            appId: "1:1091506863615:web:8b3f1fff3bca138b337bca"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const auth = getAuth(app);

        // --- AUTH LOGIC ---
        window.loginUsuario = async () => {
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;
            if(!user || !pass) return alert("Complete datos");
            
            const email = `${user.toLowerCase()}@tuapp.com`;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                alert("Usuario o Contraseña incorrectos");
            }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('user-display').value = user.email.split('@')[0].toUpperCase();
                
                // --- PERFIL ADM ---
                if (user.email === "luciano@tuapp.com") {
                    document.querySelectorAll('.adm-only').forEach(el => el.style.display = 'grid');
                    document.getElementById('btn-cloud-master').style.display = 'flex';
                } else {
                    document.querySelectorAll('.adm-only').forEach(el => el.style.display = 'none');
                }
            } else {
                document.getElementById('login-screen').style.display = 'flex';
            }
        });

        // --- RESTO DE LÓGICA LOGÍSTICA (RECORDS, MASTER, ETC) ---
        let records = [];
        let masterData = new Map();

        window.downloadMasterFromCloud = async function() {
            const btn = document.getElementById('btn-cloud-master');
            btn.innerHTML = "⏳";
            try {
                const url = await getDownloadURL(ref(storage, 'maestro.csv'));
                const res = await fetch(url);
                const text = await res.text();
                const lines = text.split(/\r\n|\n/);
                masterData.clear();
                lines.forEach(l => {
                    const c = l.split(',').map(x => x.trim().toUpperCase());
                    if(c[0]) masterData.set(c[0], { mat: c[1], stock: parseFloat(c[2]) || 0 });
                });
                btn.innerHTML = "✅";
                alert("Maestro Nube cargado");
            } catch (e) { alert("Error al bajar maestro"); btn.innerHTML = "☁️"; }
        };

        window.validateAndSave = async () => {
            const ubi = document.getElementById('location').value.toUpperCase();
            const mat = document.getElementById('material').value.toUpperCase();
            const qty = parseFloat(document.getElementById('qty').value);
            const user = auth.currentUser.email.split('@')[0].toUpperCase();

            if(!ubi || !mat || isNaN(qty)) return alert("Faltan datos");

            const record = {
                id: Date.now(),
                date: new Date().toLocaleDateString(),
                user: user,
                location: ubi,
                material: mat,
                qty: qty,
                status: 'OK'
            };

            await addDoc(collection(db, "conteos"), record);
            document.getElementById('location').value = '';
            document.getElementById('material').value = '';
            document.getElementById('qty').value = '';
            document.getElementById('location').focus();
        };

        onSnapshot(collection(db, "conteos"), (snap) => {
            records = [];
            snap.forEach(d => records.push({firebaseId: d.id, ...d.data()}));
            records.sort((a,b) => b.id - a.id);
            renderTable();
        });

        function renderTable() {
            const tbody = document.getElementById('records-body');
            document.getElementById('count-badge').innerText = records.length;
            tbody.innerHTML = records.map(r => `
                <tr>
                    <td>${r.date}</td>
                    <td><b>${r.location}</b></td>
                    <td>${r.material}</td>
                    <td>${r.qty}</td>
                    <td>${r.user}</td>
                    <td><span class="status-badge bg-ok">${r.status}</span></td>
                    <td>${auth.currentUser.email === "luciano@tuapp.com" ? `<button onclick="deleteRecord('${r.firebaseId}')">🗑️</button>` : ''}</td>
                </tr>
            `).join('');
        }

        window.deleteRecord = async (id) => { if(confirm("¿Borrar?")) await deleteDoc(doc(db, "conteos", id)); };
        window.switchView = (v) => {
            document.querySelectorAll('.view').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
            document.getElementById(`view-${v}`).classList.add('active');
        };
    </script>
</body>
</html>
