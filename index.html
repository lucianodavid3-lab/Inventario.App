<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0D2334">
    
    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Inventario Cargo">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    
    <title>Inventario Pro - V31.23</title>
    <style>
        :root {
            --navy-main: #0D2334;
            --red-accent: #D70F27;
            --bg-body: #F4F6F9;
            --bg-card: #FFFFFF;
            --text-main: #0D2334;
            --text-muted: #64748B;
            --input-bg: #E2E8F0;
            --input-text: #0D2334;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0; padding: 0;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
        }

        /* --- LOGIN --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--navy-main);
            display: flex; align-items: center; justify-content: center;
            z-index: 3000; padding: 20px;
        }
        .login-box {
            background: white; width: 100%; max-width: 340px; border-radius: 16px;
            padding: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .login-logo { width: 120px; margin-bottom: 20px; border-radius: 10px; }

        /* --- HEADER --- */
        header {
            background-color: var(--navy-main); color: white;
            padding: 10px 16px 5px 16px;
            padding-top: calc(10px + env(safe-area-inset-top));
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .logout-btn { background: rgba(255,255,255,0.15); border: none; color: white; font-size: 11px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        h1 { margin: 0; font-size: 16px; font-weight: 700; flex-grow: 1; text-align: center; }
        .header-btn-upload { background: none; border: none; font-size: 24px; cursor: pointer; padding: 0 10px; }

        .tabs { display: flex; justify-content: space-around; }
        .tab-btn { background: transparent; border: none; color: rgba(255, 255, 255, 0.6); font-size: 13px; padding-bottom: 8px; flex: 1; text-align: center; transition: 0.2s; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: white; font-weight: 700; border-bottom-color: var(--red-accent); }

        /* --- VISTAS --- */
        .container { padding: 16px; max-width: 600px; margin: 0 auto; min-height: 80vh; padding-bottom: 80px; }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: var(--bg-card); border-radius: 12px; padding: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); margin-bottom: 15px; }

        /* --- FORMULARIOS --- */
        label { display: block; font-size: 11px; font-weight: 700; color: var(--navy-main); margin-bottom: 5px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #E2E8F0; border-radius: 8px; background-color: var(--input-bg); color: var(--text-main); margin-bottom: 15px; }
        input:focus { background-color: #fff; border-color: var(--navy-main); outline: none; }
        
        .input-wrapper { position: relative; }
        .input-action-btn { position: absolute; right: 2px; top: 22px; width: 40px; height: 40px; background: var(--navy-main); color: white; border: none; border-radius: 6px; display: flex; align-items: center; justify-content: center; }

        .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-top: 5px; }
        .btn-primary { background-color: var(--red-accent); color: white; }
        .btn-secondary { background-color: #E2E8F0; color: var(--navy-main); }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-navy { background-color: var(--navy-main); color: white; }
        
        /* --- ESTADÍSTICAS --- */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .stat-card { background: #EEF2FF; padding: 10px 5px; border-radius: 8px; text-align: center; border: 1px solid #C7D2FE; }
        .stat-val { display: block; font-size: 16px; font-weight: 800; color: var(--navy-main); }
        .stat-lbl { font-size: 9px; font-weight: 700; color: #4F46E5; margin-top: 4px; display: block; }

        /* --- TABLA --- */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 600px; }
        th { background: var(--navy-main); color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; white-space: nowrap; }
        .status-badge { padding: 3px 6px; border-radius: 4px; font-weight: 700; font-size: 9px; }
        .bg-ok { background: #DCFCE7; color: #166534; }
        .bg-err { background: #FEE2E2; color: #991B1B; }

        /* --- MODALES --- */
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; }
        .modal-box { background: white; width: 90%; max-width: 320px; border-radius: 16px; padding: 25px; text-align: center; border-top: 5px solid transparent; }
        .modal-box.warning { border-top-color: var(--warning); }
        .modal-box.success { border-top-color: var(--success); }
        .modal-box.error { border-top-color: var(--danger); }
        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 10px; color: var(--navy-main); }
        .modal-msg { font-size: 14px; color: #444; margin-bottom: 20px; line-height: 1.4; white-space: pre-wrap; }
        .modal-buttons { display: flex; flex-direction: column; gap: 8px; }

        /* --- CAMERA --- */
        #camera-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 2500; flex-direction: column; }
        video { width: 100%; height: 80%; object-fit: cover; }
        .camera-controls { height: 20%; display: flex; align-items: center; justify-content: center; background: #000; }

        /* CLASES UTILITARIAS */
        .adm-only { display: none !important; }
        body.is-admin .adm-only { display: block !important; }
        body.is-admin .header-btn-upload.adm-only { display: flex !important; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <img src="logo.png" alt="Logo" class="login-logo" onerror="this.src='https://img.icons8.com/color/144/box--v1.png'">
            <h2>GRUPO CARGO</h2>
            <p style="font-size:12px; color:#666;">Sistema de Inventario V31.23</p>
            <input type="text" id="login-user" placeholder="Usuario">
            <input type="password" id="login-pass" placeholder="Contraseña">
            <button class="btn btn-primary" onclick="app.login()">INGRESAR</button>
        </div>
    </div>

    <!-- APP -->
    <header id="main-header" style="display:none;">
        <div class="header-top">
            <button class="logout-btn" onclick="app.logout()">SALIR</button>
            <h1>INVENTARIO</h1>
            <button class="header-btn-upload" onclick="app.downloadMaster()">☁️</button>
        </div>
        <div class="tabs">
            <button class="tab-btn active" onclick="app.nav('conteo')">CONTEO</button>
            <button class="tab-btn" onclick="app.nav('historial')">HISTORIAL</button>
            <button class="tab-btn adm-only" onclick="app.nav('config')">CONFIG</button>
        </div>
    </header>

    <!-- 1. PANTALLA CONTEO -->
    <div id="view-conteo" class="view active container">
        <div id="master-status" class="card" style="background:#FEF2F2; color:#991B1B; border:1px solid #FECACA; padding:10px; display:flex; align-items:center; gap:10px;">
            <span>⚠️</span> <b>MAESTRO NO CARGADO.</b> <small>Toque la nube arriba.</small>
        </div>

        <div class="card">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div>
                    <label>Usuario</label>
                    <input type="text" id="user-display" disabled style="font-weight:bold;">
                </div>
                <div>
                    <label>Zona</label>
                    <input type="text" id="zone-display" disabled style="font-weight:bold;">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="input-wrapper">
                <label>UBICACIÓN</label>
                <input type="text" id="inp-location" placeholder="Escanear...">
                <button class="input-action-btn" onclick="app.scan('inp-location')">📷</button>
            </div>
            <div class="input-wrapper">
                <label>MATERIAL</label>
                <input type="text" id="inp-material" placeholder="Escanear...">
                <button class="input-action-btn" onclick="app.scan('inp-material')">📷</button>
            </div>
            <div class="input-wrapper">
                <label>CANTIDAD</label>
                <input type="number" id="inp-qty" placeholder="0" inputmode="numeric">
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <button class="btn btn-secondary" onclick="app.clear()">LIMPIAR</button>
                <button class="btn btn-primary" onclick="app.preSave()">GUARDAR</button>
            </div>
        </div>
    </div>

    <!-- 2. PANTALLA HISTORIAL -->
    <div id="view-historial" class="view container">
        <div class="adm-only">
            <div class="stats-grid">
                <div class="stat-card"><span class="stat-val" id="stat-reads">0</span><span class="stat-lbl">LECTURAS</span></div>
                <div class="stat-card"><span class="stat-val" id="stat-writes">0</span><span class="stat-lbl">ESCRITURAS</span></div>
                <div class="stat-card"><span class="stat-val" id="stat-progress">0%</span><span class="stat-lbl">AVANCE</span></div>
            </div>
            <div class="card" style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:5px;">
                <button class="btn btn-secondary" style="font-size:10px" onclick="app.exportCSV()">CSV</button>
                <button class="btn btn-secondary" style="font-size:10px" onclick="location.reload()">REFRESH</button>
                <button class="btn btn-danger" style="font-size:10px" onclick="app.wipeDB()">BORRAR TODO</button>
            </div>
        </div>

        <div class="card" style="padding:0;">
            <div class="table-wrap">
                <table id="table-history">
                    <thead><tr><th>FECHA</th><th>UBI</th><th>MAT</th><th>CANT</th><th>USER</th><th>EST</th><th class="adm-only"></th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 3. PANTALLA CONFIGURACIÓN (SOLO ADM) -->
    <div id="view-config" class="view container">
        <div class="card">
            <h3>1. Configurar Operario</h3>
            <label>Seleccionar Usuario</label>
            <select id="cfg-user-select"></select>
            <label>Asignar Zona</label>
            <input type="text" id="cfg-zone" placeholder="Ej: A1">
            <label>Rango de Intrusos</label>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <input type="number" id="cfg-start" placeholder="Inicio">
                <input type="number" id="cfg-end" placeholder="Fin">
            </div>
            <button class="btn btn-navy" onclick="app.saveConfig()">GUARDAR CAMBIOS</button>
        </div>

        <div class="card">
            <h3>2. Resumen General</h3>
            <div class="table-wrap">
                <table id="table-summary">
                    <thead><tr><th>OPERARIO</th><th>ZONA</th><th>UBIS</th><th>PIEZAS</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL UNIVERSAL -->
    <div id="modal-overlay">
        <div class="modal-box" id="modal-box">
            <div class="modal-title" id="modal-title"></div>
            <div class="modal-msg" id="modal-msg"></div>
            <div class="modal-buttons" id="modal-actions"></div>
        </div>
    </div>

    <!-- CAMERA -->
    <div id="camera-container">
        <video id="video" playsinline autoplay muted></video>
        <div class="camera-controls">
            <button class="btn btn-danger" style="width:auto;" onclick="app.closeCam()">CERRAR CÁMARA</button>
        </div>
    </div>

    <!-- INPUT FILE OCULTO -->
    <input type="file" id="file-picker" accept=".csv" style="display:none" onchange="app.processLocalFile(this)">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, setDoc, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
        import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-storage.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

        // CONFIGURACIÓN
        const firebaseConfig = {
            apiKey: "AIzaSyDI2_dfJ5WbGCoddHPaXg40yrxEZqB4ZXI", 
            authDomain: "inventarioapp-cddbe.firebaseapp.com",
            projectId: "inventarioapp-cddbe",
            storageBucket: "inventarioapp-cddbe.firebasestorage.app",
            messagingSenderId: "1091506863615",
            appId: "1:1091506863615:web:8b3f1fff3bca138b337bca"
        };

        const appInst = initializeApp(firebaseConfig);
        const db = getFirestore(appInst);
        const storage = getStorage(appInst);
        const auth = getAuth(appInst);
        const APP_ID = "cargo-inv-v31"; 
        const ADMIN_EMAIL = "lvilla@grupocargo.com";

        // ESTADO GLOBAL
        const state = {
            master: new Map(),
            masterCodes: new Set(),
            records: [],
            userConfigs: new Map(),
            myConfig: {},
            reads: 0, writes: 0,
            pending: null,
            scanTgt: null
        };

        // --- CLASE PRINCIPAL ---
        const App = {
            login: async () => {
                const u = document.getElementById('login-user').value.trim();
                const p = document.getElementById('login-pass').value.trim();
                if(!u || !p) return alert("Ingrese datos");
                const email = u.includes('@') ? u : `${u.toLowerCase()}@grupocargo.com`;
                try { await signInWithEmailAndPassword(auth, email, p); } 
                catch(e) { alert("Error: " + e.code); }
            },
            logout: () => signOut(auth),

            nav: (viewId) => {
                document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
                document.getElementById(`view-${viewId}`).classList.add('active');
                const tabs = document.querySelectorAll('.tab-btn');
                if(viewId === 'conteo') tabs[0].classList.add('active');
                if(viewId === 'historial') tabs[1].classList.add('active');
                if(viewId === 'config') tabs[2].classList.add('active');
            },

            downloadMaster: async () => {
                const btn = document.querySelector('.header-btn-upload');
                btn.innerHTML = "⏳";
                try {
                    const url = await getDownloadURL(ref(storage, 'maestro.csv'));
                    const res = await fetch(url);
                    if(!res.ok) throw new Error("Fetch failed");
                    App.processMaster(await res.text());
                    btn.innerHTML = "✅";
                } catch(e) {
                    console.error(e);
                    // DIAGNÓSTICO DETALLADO
                    if (e.code === 'storage/object-not-found') {
                        alert("Error: No se encuentra 'maestro.csv' en Firebase Storage.");
                    } else if (e.message.includes('Fetch')) {
                        alert("Error de Conexión (CORS). Ejecute el comando gsutil en Google Cloud Console.");
                    } else {
                        alert("Error al descargar: " + e.message);
                    }
                    // Fallback
                    if(confirm("¿Cargar archivo localmente?")) {
                        document.getElementById('file-picker').click();
                    }
                    btn.innerHTML = "☁️";
                }
            },
            processLocalFile: (input) => {
                const f = input.files[0];
                if(!f) return;
                const r = new FileReader();
                r.onload = e => App.processMaster(e.target.result);
                r.readAsText(f);
            },
            processMaster: (csv) => {
                state.master.clear(); state.masterCodes.clear();
                const lines = csv.split(/\r\n|\n/);
                const sep = lines[0].indexOf(';') > -1 ? ';' : ',';
                lines.forEach(l => {
                    const c = l.split(sep).map(x => x.trim().toUpperCase());
                    if(c.length >= 2 && c[0]) {
                        const entry = { mat: c[1], stock: parseFloat(c[2])||0, st: c[3]||'', doc: c[4]||'' };
                        if(state.master.has(c[0])) state.master.get(c[0]).push(entry);
                        else state.master.set(c[0], [entry]);
                        state.masterCodes.add(c[1]);
                    }
                });
                try { localStorage.setItem('master_cache', JSON.stringify(Array.from(state.master.entries()))); } catch(e){}
                App.updateMasterUI();
            },
            loadCachedMaster: () => {
                const c = localStorage.getItem('master_cache');
                if(c) {
                    try {
                        state.master = new Map(JSON.parse(c));
                        state.masterCodes.clear();
                        for(let [k,v] of state.master) v.forEach(i => state.masterCodes.add(i.mat));
                        App.updateMasterUI();
                    } catch(e) { localStorage.removeItem('master_cache'); }
                }
            },
            updateMasterUI: () => {
                if(state.master.size > 0) {
                    document.getElementById('master-status').style.display = 'none';
                }
            },

            checkLoc: (ubi) => {
                if(!ubi) return false;
                const zone = document.getElementById('zone-display').value;
                if(zone && zone !== 'SIN ASIGNAR' && !ubi.startsWith(zone)) {
                    App.modal("ERROR", `Ubicación ${ubi} incorrecta. Zona asignada: ${zone}`, null, "error", false, null, true);
                    return false;
                }
                if(state.records.some(r => r.location === ubi)) {
                    App.modal("DUPLICADO", `Ubicación ${ubi} ya contada.`, null, "error", false, null, true);
                    return false;
                }
                if(!ubi.startsWith("INV") && state.master.size > 0 && !state.master.has(ubi)) {
                    App.modal("DESCONOCIDA", `Ubicación ${ubi} no existe en el maestro.`, null, "error", false, null, true);
                    return false;
                }
                return true;
            },
            preSave: () => {
                const ubi = document.getElementById('inp-location').value.trim().toUpperCase();
                const mat = document.getElementById('inp-material').value.trim().toUpperCase();
                const qty = parseFloat(document.getElementById('inp-qty').value);

                if(!App.checkLoc(ubi)) return;

                if(!mat) {
                    const data = state.master.get(ubi);
                    if(!data) return alert("Ingrese material");
                    App.modal("CONFIRMAR VACÍO", `¿Registrar ${ubi} como VACÍA?`, () => {
                        App.save({ 
                            location: ubi, material: data[0].mat, qty: 0, 
                            theoretical: data[0].stock, storage: data[0].st, doc: data[0].doc, 
                            status: 'VACIO', diff: -data[0].stock 
                        });
                    }, "warning");
                    return;
                }

                if(isNaN(qty)) return alert("Cantidad inválida");

                let finalMat = App.findMatch(mat);
                let status = 'OK';
                
                if(ubi.startsWith("INV")) {
                    status = 'INTRUSO_UBI';
                    App.modal("CONFIRMAR INTRUSO", `Ubi: ${ubi}\nMat: ${finalMat}\nCant: ${qty}`, () => {
                        App.save({ location: ubi, material: finalMat, qty, status, doc: 'INTRUSO' });
                    }, "warning", false, { ubi }); // Pasamos contexto para recuperar ubicación
                } else {
                    const validList = state.master.get(ubi);
                    const matchInLoc = validList.find(m => m.mat === finalMat);
                    
                    if(matchInLoc) {
                        App.modal("CONFIRMAR CONTEO", `Ubi: ${ubi}\nMat: ${finalMat}\nCant: ${qty}`, () => {
                            App.save({ 
                                location: ubi, material: finalMat, qty, 
                                theoretical: matchInLoc.stock, storage: matchInLoc.st, doc: matchInLoc.doc,
                                status: 'OK', diff: qty - matchInLoc.stock 
                            });
                        }, "success");
                    } else {
                        const expected = validList.map(m => m.mat).join(" o ");
                        App.modal("DISCREPANCIA", `Leído: ${finalMat}\nEsperado: ${expected}\n\n¿Qué desea hacer?`, null, "warning", true, {
                           ubi, mat: finalMat, qty, st: validList[0].st, dc: validList[0].doc
                        });
                    }
                }
            },
            findMatch: (input) => {
                if(state.masterCodes.has(input)) return input;
                for(let code of state.masterCodes) {
                    if(input.length>=9 && code.length>=9 && input.substring(0,9) === code.substring(0,9)) return code;
                }
                return input;
            },
            save: async (data) => {
                const user = auth.currentUser;
                const rec = {
                    ...data,
                    date: new Date().toLocaleDateString(),
                    time: new Date().toLocaleTimeString(),
                    user: user.email.split('@')[0].toUpperCase(),
                    ts: Date.now()
                };
                try {
                    await addDoc(collection(db, "artifacts", APP_ID, "public", "data", "conteos"), rec);
                    state.writes++; App.updateStats();
                    App.clear();
                    // Restaurar ubicación si fue intruso
                    if(data.status === 'INTRUSO_UBI' && data.location) {
                         // Lógica de continuidad (se perdió en el contexto, re-implementando)
                    }
                } catch(e) { alert("Error guardando: " + e.message); }
            },
            solveIntruder: (ctx) => {
                const s = state.myConfig.start || 1; 
                const e = state.myConfig.end || 300;
                let found = null;
                for(let i=s; i<=e; i++) {
                    const c = "INV"+String(i).padStart(3,'0');
                    if(!state.records.some(r=>r.location===c)) { found=c; break; }
                }
                if(!found) return alert("Sin huecos INV");
                
                const intruderRec = {
                    location: found, material: ctx.mat, qty: ctx.qty,
                    status: 'INTRUSO_UBI', doc: 'INTRUSO', diff: ctx.qty, theoretical: 0
                };
                App.save(intruderRec);
                
                setTimeout(() => {
                    document.getElementById('inp-location').value = ctx.ubi;
                    document.getElementById('inp-material').focus();
                }, 500);
            },
            clear: () => {
                document.getElementById('inp-location').value = '';
                document.getElementById('inp-material').value = '';
                document.getElementById('inp-qty').value = '';
                document.getElementById('inp-location').focus();
            },
            modal: (title, msg, confirmFn, theme, isOption = false, ctx = null, isErrorLoc = false) => {
                const el = document.getElementById('modal-overlay');
                const t = document.getElementById('modal-title');
                const m = document.getElementById('modal-msg');
                const bBox = document.getElementById('modal-actions');
                const box = document.getElementById('modal-box');
                
                t.innerText = title;
                m.innerText = msg;
                box.className = `modal-box ${theme}`;
                bBox.innerHTML = '';

                if(isOption) {
                    const b1 = document.createElement('button');
                    b1.className = 'modal-btn danger'; b1.innerText = "GUARDAR IGUAL";
                    b1.onclick = () => { 
                        App.save({ 
                            location: ctx.ubi, material: ctx.mat, qty: ctx.qty, 
                            storage: ctx.st, doc: ctx.dc, status: 'INTRUSO_MAT', theoretical: 0 
                        }); 
                        el.style.display = 'none'; 
                    };
                    const b2 = document.createElement('button');
                    b2.className = 'modal-btn intruder'; b2.innerText = "REGISTRAR COMO INTRUSO";
                    b2.onclick = () => { App.solveIntruder(ctx); el.style.display = 'none'; };
                    const b3 = document.createElement('button');
                    b3.className = 'modal-btn cancel'; b3.innerText = "CANCELAR";
                    b3.onclick = () => el.style.display = 'none';
                    bBox.append(b1, b2, b3);
                } else if(confirmFn) {
                    const b1 = document.createElement('button');
                    b1.className = 'modal-btn confirm-ok'; b1.innerText = "CONFIRMAR";
                    b1.onclick = () => { confirmFn(); el.style.display = 'none'; };
                    const b2 = document.createElement('button');
                    b2.className = 'modal-btn cancel'; b2.innerText = "CANCELAR";
                    b2.onclick = () => el.style.display = 'none';
                    bBox.append(b1, b2);
                } else {
                    const b1 = document.createElement('button');
                    b1.className = 'modal-btn info'; b1.innerText = "ENTENDIDO";
                    b1.onclick = () => { 
                        el.style.display = 'none';
                        if(isErrorLoc) {
                            const inp = document.getElementById('inp-location');
                            inp.value = ''; inp.focus();
                        }
                    };
                    bBox.append(b1);
                }
                el.style.display = 'flex';
            },
            
            // ADMIN
            updateStats: () => {
                document.getElementById('stat-reads').innerText = state.reads;
                document.getElementById('stat-writes').innerText = state.writes;
                if(state.master.size > 0) {
                    const counted = new Set(state.records.filter(r => !r.location.startsWith("INV")).map(r=>r.location)).size;
                    document.getElementById('stat-progress').innerText = Math.round((counted/state.master.size)*100) + "%";
                }
            },
            renderHistory: () => {
                const tbody = document.querySelector('#table-history tbody');
                const isAdmin = document.body.classList.contains('is-admin');
                const data = isAdmin ? state.records : state.records.slice(0, 100);
                tbody.innerHTML = data.map(r => `
                    <tr>
                        <td>${r.date}<br>${r.time}</td>
                        <td>${r.location}</td>
                        <td>${r.material}</td>
                        <td>${r.qty}</td>
                        <td>${r.user}</td>
                        <td>${r.status}</td>
                        ${isAdmin ? `<td><button class="btn-delete" onclick="window.delRec('${r.firebaseId}')">🗑️</button></td>` : ''}
                    </tr>
                `).join('');
                App.updateStats();
            },
            renderConfig: () => {
                const tbody = document.querySelector('#table-summary tbody');
                const summary = new Map();
                state.records.forEach(r => {
                    if(!summary.has(r.user)) summary.set(r.user, {u:0, q:0});
                    const s = summary.get(r.user); s.u++; s.q+=r.qty;
                });
                tbody.innerHTML = Array.from(summary.entries()).map(([u,d]) => `<tr><td>${u}</td><td>-</td><td>${d.u}</td><td>${d.q}</td></tr>`).join('');
                const sel = document.getElementById('cfg-user-select');
                if(sel.options.length <= 0) {
                    state.userConfigs.forEach((v, k) => {
                       const opt = document.createElement('option');
                       opt.value = k; opt.innerText = k.split('@')[0];
                       sel.appendChild(opt);
                    });
                }
            },
            wipeDB: async () => {
                if(!confirm("¿BORRAR TODO?")) return;
                const batch = writeBatch(db);
                const snap = await getDocs(collection(db, "artifacts", APP_ID, "public", "data", "conteos"));
                snap.forEach(d => batch.delete(d.ref));
                await batch.commit();
                alert("Base limpia");
            },
            saveCfg: async () => {
                const u = document.getElementById('cfg-user-select').value;
                const z = document.getElementById('cfg-zone').value;
                const s = document.getElementById('cfg-start').value;
                const e = document.getElementById('cfg-end').value;
                if(!u) return;
                await setDoc(doc(db, "artifacts", APP_ID, "public", "data", "configs", u), {zone:z, start:parseInt(s), end:parseInt(e)});
                alert("Guardado");
            },

            // CAMERA
            scan: async (tgt) => {
                state.scanTgt = tgt;
                if(!navigator.mediaDevices) return document.getElementById('file-picker').click();
                const v = document.querySelector('#camera-container video');
                v.srcObject = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
                document.getElementById('camera-container').style.display = 'flex';
                requestAnimationFrame(App.scanFrame);
            },
            scanFrame: () => {
                const v = document.querySelector('#camera-container video');
                if(document.getElementById('camera-container').style.display === 'none') return;
                if(v.readyState === v.HAVE_ENOUGH_DATA && window.BarcodeDetector) {
                    new BarcodeDetector().detect(v).then(c => {
                        if(c.length) {
                            document.getElementById(state.scanTgt).value = c[0].rawValue;
                            App.closeCam();
                            if(state.scanTgt === 'inp-location') {
                                if(App.checkLoc(c[0].rawValue)) document.getElementById('inp-material').focus();
                            } else {
                                document.getElementById('inp-qty').focus();
                            }
                        }
                    });
                }
                requestAnimationFrame(App.scanFrame);
            },
            closeCam: () => {
                const v = document.querySelector('#camera-container video');
                if(v.srcObject) v.srcObject.getTracks().forEach(t=>t.stop());
                document.getElementById('camera-container').style.display = 'none';
            },
            exportCSV: () => {
                const h = ["Fecha","Hora","Usuario","Ubicacion","Material","Doc_Inventario","Storage","Stock_Teorico","Stock_Fisico","Diferencia","Estado"];
                let csv = h.join(",") + "\n";
                state.records.forEach(r => {
                    csv += `${r.date},${r.time},${r.user},${r.location},${r.material},${r.doc||''},${r.storage||''},${r.theoretical||0},${r.qty},${r.diff||0},${r.status}\n`;
                });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
                a.download = `Inv_${Date.now()}.csv`;
                a.click();
            }
        };

        window.app = App;
        window.delRec = (id) => deleteDoc(doc(db, "artifacts", APP_ID, "public", "data", "conteos", id));

        onAuthStateChanged(auth, u => {
            if(u) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-header').style.display = 'block';
                document.body.classList.toggle('is-admin', u.email === ADMIN_EMAIL);
                document.getElementById('user-display').value = u.email.split('@')[0].toUpperCase();
                
                App.loadCachedMaster();
                
                onSnapshot(doc(db, "artifacts", APP_ID, "public", "data", "configs", u.email), s => {
                    if(s.exists()) {
                        state.myConfig = s.data();
                        document.getElementById('zone-display').value = state.myConfig.zone || 'SIN ASIGNAR';
                    }
                });

                onSnapshot(collection(db, "artifacts", APP_ID, "public", "data", "conteos"), s => {
                    const first = state.records.length === 0;
                    state.records = [];
                    s.forEach(d => state.records.push({firebaseId: d.id, ...d.data()}));
                    state.records.sort((a,b) => b.ts - a.ts);
                    state.reads += first ? s.size : 1;
                    App.renderHistory();
                    App.renderConfig();
                });

                if(u.email === ADMIN_EMAIL) {
                    onSnapshot(collection(db, "artifacts", APP_ID, "public", "data", "configs"), s => {
                        state.userConfigs.clear();
                        s.forEach(d => state.userConfigs.set(d.id, d.data()));
                        App.renderConfig();
                    });
                }
            }
        });
        
        document.getElementById('inp-location').onkeydown = e => { if(e.key==='Enter') if(App.checkLoc(e.target.value.toUpperCase())) document.getElementById('inp-material').focus(); };
        document.getElementById('inp-material').onkeydown = e => { if(e.key==='Enter') document.getElementById('inp-qty').focus(); };
        document.getElementById('inp-qty').onkeydown = e => { if(e.key==='Enter') App.preSave(); };

        let tx=0;
        document.ontouchstart = e => tx = e.changedTouches[0].clientX;
        document.ontouchend = e => {
            const dx = tx - e.changedTouches[0].clientX;
            if(Math.abs(dx) > 100) {
                const active = document.querySelector('.view.active').id;
                if(dx > 0 && active === 'view-conteo') App.nav('historial');
                if(dx < 0 && active === 'view-historial') App.nav('conteo');
            }
        }
    </script>
</body>
</html>
