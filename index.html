<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0D2334">
    
    <!-- Configuración PWA para Instalación Real -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Inventario Cargo">
    
    <!-- Iconos para la Pantalla de Inicio -->
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    
    <title>Inventario Pro - V31.21</title>
    <style>
        :root {
            --navy-main: #0D2334;
            --red-accent: #D70F27;
            --bg-body: #F4F6F9;
            --bg-card: #FFFFFF;
            --text-main: #0D2334;
            --text-muted: #64748B;
            --input-bg: #E2E8F0;
            --input-text: #0D2334;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0; padding: 0;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
        }

        /* --- PANTALLA LOGIN --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--navy-main);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000; padding: 20px;
        }
        .login-box {
            background: white; width: 100%; max-width: 360px; border-radius: 16px;
            padding: 40px 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .login-logo { 
            width: 180px; 
            height: auto;
            margin-bottom: 20px; 
            border-radius: 12px; 
        }
        .version-tag { font-size: 10px; color: var(--text-muted); display: block; margin-bottom: 15px; }

        /* --- HEADER --- */
        header {
            background-color: var(--navy-main); color: white;
            padding: 10px 16px 0 16px;
            padding-top: calc(10px + env(safe-area-inset-top));
            box-shadow: 0 4px 12px rgba(13,35,52,0.2);
            position: sticky; top: 0; z-index: 100;
        }
        .header-top { display: grid; grid-template-columns: 80px 1fr 60px; align-items: center; margin-bottom: 10px; }
        .logout-btn { background: rgba(255,255,255,0.15); border: none; color: white; font-size: 11px; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
        h1 { margin: 0; font-size: 16px; text-align: center; font-weight: 700; }
        .header-btn-upload { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; border-radius: 8px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; justify-self: end; }

        .tabs { display: flex; gap: 10px; justify-content: center; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { background: transparent; border: none; color: rgba(255, 255, 255, 0.6); font-size: 12px; padding-bottom: 10px; flex: 1; text-align: center; transition: 0.2s; border-bottom: 3px solid transparent; cursor: pointer; min-width: 80px; }
        .tab-btn.active { color: white; font-weight: 700; border-bottom-color: var(--red-accent); }

        /* --- VISTAS --- */
        .container { padding: 16px; max-width: 600px; margin: 0 auto; min-height: 80vh; }
        .view { display: none; }
        .view.active { display: block; animation: slideIn 0.2s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        .card { background: var(--bg-card); border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 12px; border: 1px solid rgba(0,0,0,0.05); }

        /* --- INFO ADM --- */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
            margin-bottom: 16px; 
        }
        .stat-card { 
            background: #EEF2FF; 
            padding: 12px 5px; 
            border-radius: 10px; 
            text-align: center; 
            border: 1px solid #C3DAFE; 
        }
        .stat-val { display: block; font-size: 16px; font-weight: 800; color: var(--navy-main); }
        .stat-lbl { font-size: 8px; font-weight: 700; color: #4338CA; text-transform: uppercase; margin-top: 4px; display: block; }

        /* --- FORM --- */
        label { display: block; font-size: 10px; font-weight: 700; color: var(--navy-main); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 12px; font-size: 16px; border: none; border-radius: 8px; background-color: var(--input-bg); color: var(--input-text); margin-bottom: 15px; width: 100% !important; }
        input:focus { background-color: #fff; box-shadow: 0 0 0 2px var(--navy-main); }
        .input-wrapper { position: relative; }
        .input-action-btn { position: absolute; right: 4px; top: 18px; width: 40px; height: 40px; background: var(--navy-main); color: white; border: none; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--red-accent); color: white; }
        .btn-secondary { background-color: var(--input-bg); color: var(--navy-main); }
        .btn-danger-block { background-color: var(--danger); color: white; }
        
        /* --- TABLAS --- */
        .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 600px; }
        th { background: var(--navy-main); color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; white-space: nowrap; }
        .status-badge { padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 800; text-transform: uppercase; }
        .bg-ok { background: #DCFCE7; color: #166534; }
        .bg-err { background: #FEE2E2; color: #991B1B; }
        .bg-empty { background: #F1F5F9; color: #64748B; border: 1px solid #CBD5E1; }

        /* --- MODALES --- */
        #modal-overlay, #intruder-modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 35, 52, 0.85); z-index: 1000;
            align-items: center; justify-content: center; backdrop-filter: blur(2px);
        }
        .modal-box { background: white; width: 90%; max-width: 340px; border-radius: 16px; padding: 25px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.4); border: 4px solid transparent; }
        .modal-box.error-mode { border-color: var(--danger); }
        .modal-box.success-mode { border-color: var(--success); }
        .modal-box.warning-mode { border-color: var(--warning); }
        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 10px; color: var(--navy-main); }
        .success-mode .modal-title { color: var(--success); }
        .modal-msg { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; white-space: pre-wrap; }
        .modal-btn { width: 100%; padding: 14px; border-radius: 10px; font-weight: 700; border: none; margin-bottom: 10px; cursor: pointer; font-size: 13px; }
        .modal-btn.confirm-ok { background: var(--success); color: white; }
        .modal-btn.cancel { background: var(--input-bg); color: var(--navy-main); }
        .modal-btn.danger { background: var(--red-accent); color: white; }

        /* --- CÁMARA --- */
        #camera-container { display: none; position: relative; margin-bottom: 10px; border-radius: 12px; overflow: hidden; background: black; border: 3px solid var(--red-accent); }
        video { width: 100%; display: block; }
        .camera-overlay { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; color: white; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,0.8); pointer-events: none; }
        .camera-close { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; font-size: 22px; font-weight: bold; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }

        .btn-delete { background: #FEE2E2; color: #991B1B; border: none; border-radius: 6px; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .adm-only { display: none; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <img src="logo.png" alt="Logo" class="login-logo" onerror="this.src='https://img.icons8.com/color/144/box--v1.png'">
            <h2>GRUPO CARGO</h2>
            <span class="version-tag">SISTEMA INVENTARIO V31.21</span>
            <input type="text" id="login-user" placeholder="Usuario (ej: luciano)">
            <input type="password" id="login-pass" placeholder="Contraseña">
            <button class="btn btn-primary" onclick="loginUsuario()">INGRESAR</button>
        </div>
    </div>

    <header id="main-header" style="display:none;">
        <div class="header-top">
            <button class="logout-btn" onclick="logout()">SALIR</button>
            <h1>Inventario Cargo</h1>
            <button class="header-btn-upload" id="btn-cloud-master" onclick="downloadMasterFromCloud()" title="Sincronizar Maestro">☁️</button>
        </div>
        <div class="tabs">
            <button class="tab-btn active" id="tab-conteo" onclick="switchView('conteo')">CONTEO</button>
            <button class="tab-btn" id="tab-historial" onclick="switchView('historial')">HISTORIAL</button>
            <button class="tab-btn adm-only" id="tab-config" onclick="switchView('config')">CONFIG</button>
        </div>
    </header>

    <div id="view-conteo" class="view active container">
        <div id="master-alert-box" style="background:#FEF2F2; border:1px solid #FECACA; color:#991B1B; padding:12px; border-radius:10px; font-size:12px; margin-bottom:12px; display:flex; align-items:center; gap:10px;">
            <span>⚠️</span> <div><strong>ATENCIÓN:</strong> Maestro no cargado.</div>
        </div>
        <div id="master-success-box" style="display:none; background:#DCFCE7; border:1px solid #86EFAC; color:#166534; padding:12px; border-radius:10px; font-size:12px; margin-bottom:12px; align-items:center; gap:10px;">
            <span>✅</span> <div id="master-info-text">Maestro activo.</div>
        </div>

        <div class="card">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div>
                    <label>Operario</label>
                    <input type="text" id="user-display" disabled style="font-weight:700; background:#F1F5F9;">
                </div>
                <div>
                    <label>Sector / Zona</label>
                    <input type="text" id="zone-display" disabled style="font-weight:700; background:#F1F5F9; text-transform:uppercase;">
                    <input type="hidden" id="zone-filter">
                </div>
            </div>
        </div>

        <div id="camera-container">
            <video id="video" playsinline muted autoplay></video>
            <div class="camera-overlay">ENFOQUE EL CÓDIGO</div>
            <button class="camera-close" onclick="stopCamera()">✕</button>
        </div>

        <div class="card">
            <div class="input-wrapper">
                <label>Ubicación</label>
                <input type="text" id="location" placeholder="Escanear ubicación">
                <button class="input-action-btn" onclick="startCamera('location')">📷</button>
            </div>
            <div class="input-wrapper">
                <label>Material</label>
                <input type="text" id="material" placeholder="Escanear material">
                <button class="input-action-btn" onclick="startCamera('material')">📷</button>
            </div>
            <div class="input-wrapper">
                <label>Cantidad</label>
                <input type="number" id="qty" placeholder="0" inputmode="numeric">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 5px;">
                <button class="btn btn-secondary" onclick="window.clearForm()">LIMPIAR</button>
                <button class="btn btn-primary" onclick="validateAndSave()">GUARDAR</button>
            </div>
        </div>
    </div>

    <div id="view-historial" class="view container">
        <div class="adm-only">
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-val" id="reads-count">0</span>
                    <span class="stat-lbl">Lecturas</span>
                </div>
                <div class="stat-card" style="background: #FFFBEB; border-color: #FDE68A;">
                    <span class="stat-val" id="progress-percent">0%</span>
                    <span class="stat-lbl">% Avance</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val" id="count-badge">0</span>
                    <span class="stat-lbl">Registros</span>
                </div>
            </div>
            <div class="card" style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; padding: 10px; margin-bottom: 20px;">
                <button class="btn btn-secondary" onclick="exportCSV()" style="font-size:10px; height: 42px;">CSV FULL</button>
                <button class="btn btn-secondary" onclick="location.reload()" style="font-size:10px; height: 42px;">REFRESCAR</button>
                <button class="btn btn-danger-block" onclick="resetAllProtected()" style="font-size:10px; height: 42px;">BORRAR TODO</button>
            </div>
        </div>
        <div class="card" style="padding: 0; overflow: hidden;">
            <div class="table-wrap">
                <table id="records-table">
                    <thead>
                        <tr><th>Fecha/Hora</th><th>Ubi</th><th>Mat</th><th>Cant</th><th>Operario</th><th>Estado</th><th class="adm-only"></th></tr>
                    </thead>
                    <tbody id="records-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="view-config" class="view container adm-only">
        <div class="card" style="display: block;">
            <h3 style="margin-top:0;">Configurar Operario</h3>
            <label>Seleccionar Usuario</label>
            <select id="config-user-select"></select>
            
            <label>Sector / Zona (Prefijo)</label>
            <input type="text" id="config-zone" placeholder="Ej: A1" maxlength="3" style="text-transform: uppercase;">
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label>INV Inicio</label>
                    <input type="number" id="config-inv-start" placeholder="1">
                </div>
                <div>
                    <label>INV Fin</label>
                    <input type="number" id="config-inv-end" placeholder="300">
                </div>
            </div>
            <button class="btn btn-primary" onclick="saveUserConfig()">GUARDAR CONFIGURACIÓN</button>
        </div>
        
        <div class="card" style="display: block;">
            <h3 style="margin-top:0;">Resumen General</h3>
            <div class="table-wrap">
                <table style="min-width: 100%;">
                    <thead>
                        <tr><th>Operario</th><th>Sector</th><th>Ubis</th><th>Piezas</th></tr>
                    </thead>
                    <tbody id="user-summary-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODALES -->
    <div id="modal-overlay">
        <div class="modal-box" id="modal-box">
            <div id="modal-icon" style="font-size: 40px; margin-bottom: 10px;">⚠️</div>
            <div class="modal-title" id="modal-title"></div>
            <div class="modal-msg" id="modal-msg"></div>
            <button class="modal-btn" id="modal-confirm-btn" style="display:none;"></button>
            <button class="modal-btn intruder" id="modal-intruder-btn" style="display:none;">REGISTRAR INTRUSO</button>
            <button class="modal-btn cancel" id="modal-cancel-btn" onclick="window.closeModal()">CANCELAR</button>
            <button class="modal-btn info" id="modal-ok-btn" style="display:none;">ENTENDIDO</button>
        </div>
    </div>

    <div id="intruder-modal-overlay">
        <div class="modal-box">
            <div class="modal-title">ASIGNACIÓN INTRUSO</div>
            <div id="intruder-location-display" style="font-size: 28px; font-weight: 900; color: #D70F27; margin: 15px 0;"></div>
            <div id="intruder-material-display" style="font-weight:800; color: var(--navy-main); margin-bottom:15px; font-size: 12px;"></div>
            <label>Cantidad Física:</label>
            <input type="number" id="intruder-qty-input" placeholder="0" style="text-align: center; font-weight: 800; font-size: 20px;">
            <button class="btn btn-primary" id="btn-save-intruder">GUARDAR INTRUSO</button>
            <button class="btn btn-secondary" onclick="window.closeIntruderModal()">CANCELAR</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, getDocs, writeBatch, setDoc } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
        import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-storage.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDI2_dfJ5WbGCoddHPaXg40yrxEZqB4ZXI", 
            authDomain: "inventarioapp-cddbe.firebaseapp.com",
            projectId: "inventarioapp-cddbe",
            storageBucket: "inventarioapp-cddbe.firebasestorage.app",
            messagingSenderId: "1091506863615",
            appId: "1:1091506863615:web:8b3f1fff3bca138b337bca"
        };
        
        const appIdActual = typeof __app_id !== 'undefined' ? __app_id : 'cargo-inv-v31';
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const auth = getAuth(app);

        const ADMIN_EMAIL = "lvilla@grupocargo.com";
        let masterData = new Map();
        let MASTER_CODES = new Set();
        let records = [];
        let userConfigs = new Map();
        let currentUserConfig = { zone: '', start: 1, end: 300 };
        let barcodeDetector = ('BarcodeDetector' in window) ? new BarcodeDetector({formats: ['code_128','code_39','ean_13']}) : null;
        let pendingSaveData = null;
        let originalPendingLocation = null;
        let currentIntruderData = null;

        // --- EXPOSICIÓN GLOBAL ---
        window.closeModal = () => document.getElementById('modal-overlay').style.display = 'none';
        window.closeIntruderModal = () => document.getElementById('intruder-modal-overlay').style.display = 'none';
        window.switchView = (v) => {
            document.querySelectorAll('.view').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
            document.getElementById(`view-${v}`).classList.add('active');
            document.getElementById(`tab-${v}`).classList.add('active');
        };
        window.clearForm = () => {
            document.getElementById('location').value = '';
            document.getElementById('material').value = '';
            document.getElementById('qty').value = '';
            document.getElementById('location').focus();
        };

        // --- AUTH ---
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
            } catch(e) {}
        };

        window.loginUsuario = async () => {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            if (!u || !p) return showAlert("DATOS INCOMPLETOS", "Ingrese credenciales.", null, 'error');
            const email = u.includes('@') ? u : `${u.toLowerCase()}@grupocargo.com`;
            try { await signInWithEmailAndPassword(auth, email, p); } 
            catch (e) { showAlert("FALLO DE ACCESO", "Credenciales incorrectas.", null, 'error'); }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            if (user && !user.isAnonymous) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-header').style.display = 'block';
                document.getElementById('user-display').value = user.email.split('@')[0].toUpperCase();
                const isAdmin = user.email === ADMIN_EMAIL;
                document.querySelectorAll('.adm-only').forEach(el => el.style.display = isAdmin ? 'grid' : 'none');
                initRealtimeSync(); loadLocalMaster(); loadGlobalConfigs(); listenToMyConfig(user.email);
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('main-header').style.display = 'none';
            }
        });

        // --- SYNC Y CONFIGS ---
        function initRealtimeSync() {
            const collRef = collection(db, "artifacts", appIdActual, "public", "data", "conteos");
            onSnapshot(collRef, (snap) => {
                records = [];
                snap.forEach(d => records.push({ firebaseId: d.id, ...d.data() }));
                records.sort((a, b) => b.id - a.id);
                renderTable(); renderUserSummary();
            });
        }

        function loadGlobalConfigs() {
            const collRef = collection(db, "artifacts", appIdActual, "public", "data", "configs");
            onSnapshot(collRef, (snap) => {
                const sel = document.getElementById('config-user-select');
                const users = new Set();
                snap.forEach(d => { userConfigs.set(d.id, d.data()); users.add(d.id); });
                if(sel) sel.innerHTML = Array.from(users).map(u => `<option value="${u}">${u.split('@')[0].toUpperCase()}</option>`).join('');
                renderUserSummary();
            });
        }

        function listenToMyConfig(email) {
            onSnapshot(doc(db, "artifacts", appIdActual, "public", "data", "configs", email), (d) => {
                if(d.exists()) {
                    currentUserConfig = d.data();
                    document.getElementById('zone-display').value = currentUserConfig.zone || 'SECTOR NO ASIGNADO';
                    document.getElementById('zone-filter').value = currentUserConfig.zone || '';
                }
            });
        }

        window.saveUserConfig = async () => {
            const email = document.getElementById('config-user-select').value;
            const zone = document.getElementById('config-zone').value.trim().toUpperCase();
            const start = parseInt(document.getElementById('config-inv-start').value);
            const end = parseInt(document.getElementById('config-inv-end').value);
            try {
                await setDoc(doc(db, "artifacts", appIdActual, "public", "data", "configs", email), { zone, start, end }, { merge: true });
                showAlert("SINCRONIZADO", "Configuración para " + email + " guardada.", null, 'success');
            } catch(e) { showAlert("ERROR", "No se pudo guardar en la nube.", null, 'error'); }
        };

        // --- MAESTRO ---
        window.downloadMasterFromCloud = async () => {
            const btn = document.getElementById('btn-cloud-master');
            btn.innerHTML = "⏳";
            try {
                const url = await getDownloadURL(ref(storage, 'maestro.csv'));
                const res = await fetch(url);
                processMasterData(await res.text());
                btn.innerHTML = "✅"; playSound('success');
                showAlert("MAESTRO OK", "Datos descargados.", null, 'success');
            } catch (e) {
                showAlert("ERROR NUBE", "No se pudo conectar al Storage. Revise permisos.", null, 'error');
                btn.innerHTML = "☁️";
            }
        };

        function processMasterData(csv) {
            const lines = csv.split(/\r\n|\n/);
            masterData.clear(); MASTER_CODES.clear();
            const sep = lines[0].indexOf(';') > -1 ? ';' : ',';
            lines.forEach(l => {
                const c = l.split(sep).map(x => x.trim().toUpperCase());
                if (c.length >= 2 && c[0]) {
                    const e = { mat: c[1], stock: parseFloat(c[2]) || 0, storage: c[3]||'', doc: c[4]||'' };
                    if (masterData.has(c[0])) masterData.get(c[0]).push(e);
                    else masterData.set(c[0], [e]);
                    MASTER_CODES.add(c[1]);
                }
            });
            localStorage.setItem('inv_master_v31', JSON.stringify(Array.from(masterData.entries())));
            updateMasterUI();
        }

        function loadLocalMaster() {
            const stored = localStorage.getItem('inv_master_v31');
            if (stored) {
                masterData = new Map(JSON.parse(stored));
                MASTER_CODES.clear();
                for (let [u, items] of masterData) items.forEach(i => MASTER_CODES.add(i.mat));
                updateMasterUI();
            }
        }

        function updateMasterUI() {
            let total = 0; masterData.forEach(list => total += list.length);
            if (total > 0) {
                document.getElementById('master-alert-box').style.display = 'none';
                document.getElementById('master-success-box').style.display = 'flex';
                document.getElementById('master-info-text').innerText = `Maestro activo: ${total} registros.`;
                updateStatsUI();
            }
        }

        // --- LOGICA DE NEGOCIO ---
        function getMatchedMaterial(scan) {
            if (!scan) return "";
            const s = scan.trim().toUpperCase();
            if (MASTER_CODES.has(s)) return s;
            for (let code of MASTER_CODES) {
                if (s.length >= 9 && code.length >= 9 && s.substring(0,9) === code.substring(0,9)) return code;
            }
            return s;
        }

        window.checkLocation = (ubi) => {
            if (!ubi) return false;
            const zone = document.getElementById('zone-filter').value.toUpperCase();
            const cleanAndFocus = () => { const i = document.getElementById('location'); if(i){ i.value=''; i.focus(); } };
            if (zone && !ubi.startsWith(zone)) { showAlert("ZONA INCORRECTA", `Pertenece a ${zone}.`, cleanAndFocus, 'error'); return false; }
            if (records.some(r => r.location === ubi)) { showAlert("DUPLICADO", `${ubi} ya contado.`, cleanAndFocus, 'error'); return false; }
            if (!ubi.startsWith("INV") && masterData.size > 0 && !masterData.has(ubi)) { showAlert("NO EXISTE", `${ubi} no está en maestro.`, cleanAndFocus, 'error'); return false; }
            return true;
        };

        window.verifyMaterialBeforeQty = (onSuccess) => {
            const ubi = document.getElementById('location').value.trim().toUpperCase();
            const mat = document.getElementById('material').value.trim().toUpperCase();
            if (!mat || ubi.startsWith("INV")) return onSuccess();
            const list = masterData.get(ubi);
            if (list) {
                const match = list.find(m => m.mat === getMatchedMaterial(mat));
                if (!match) {
                    playSound('error');
                    originalPendingLocation = ubi; 
                    showAlert("MATERIAL INESPERADO", `${mat} no coincide.\n¿Guardar igual o Intruso?`, onSuccess, 'warning', () => handleIntruderRegistration());
                    return;
                }
            }
            onSuccess();
        };

        window.validateAndSave = async () => {
            if (masterData.size === 0) return showAlert("SIN MAESTRO", "Descargue la nube primero.", null, 'error');
            const ubi = document.getElementById('location').value.trim().toUpperCase();
            const mat = document.getElementById('material').value.trim().toUpperCase();
            const qty = parseFloat(document.getElementById('qty').value);
            if (!window.checkLocation(ubi)) return;
            if (!mat) {
                const list = masterData.get(ubi);
                if (!list) return;
                pendingSaveData = { id: Date.now(), date: new Date().toLocaleDateString(), time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), user: auth.currentUser.email.split('@')[0].toUpperCase(), location: ubi, material: list[0].mat, qty: 0, theoretical: list[0].stock, storage: list[0].storage, doc: list[0].doc, status: 'VACIO', diff: -list[0].stock };
                showAlert("CONFIRMAR VACÍO", `¿Registrar ${ubi} VACÍA?`, confirmSave, 'warning');
                return;
            }
            if (isNaN(qty)) return showAlert("SIN CANTIDAD", "Ingrese número.", null, 'error');
            window.verifyMaterialBeforeQty(() => {
                let status = 'OK', theoretical = 0, diff = 0, finalMat = getMatchedMaterial(mat), st='', dc='', theme='success';
                if (ubi.startsWith("INV")) status = 'INTRUSO_UBI';
                else {
                    const list = masterData.get(ubi);
                    if (list) {
                        const match = list.find(m => m.mat === finalMat);
                        if (match) { finalMat = match.mat; theoretical = match.stock; diff = qty - theoretical; st = match.storage; dc = match.doc; }
                        else { status = 'INTRUSO_MAT'; theme = 'warning'; st = list[0].storage; dc = list[0].doc; }
                    }
                }
                pendingSaveData = { id: Date.now(), date: new Date().toLocaleDateString(), time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), user: auth.currentUser.email.split('@')[0].toUpperCase(), location: ubi, material: finalMat, qty, theoretical, storage: st, doc: dc, status, diff };
                showAlert("REVISIÓN", `UBI: ${ubi}\nMAT: ${finalMat}\nCANT: ${qty}`, confirmSave, theme);
            });
        };

        function confirmSave() { 
            if(pendingSaveData) { 
                const isInt = pendingSaveData.status.startsWith('INTRUSO');
                const orig = originalPendingLocation;
                addDoc(collection(db, "artifacts", appIdActual, "public", "data", "conteos"), pendingSaveData).then(() => {
                    playSound('success'); window.clearForm();
                    if(isInt && orig) { document.getElementById('location').value = orig; document.getElementById('material').focus(); originalPendingLocation = null; }
                });
                pendingSaveData = null; window.closeModal(); 
            } 
        }

        function handleIntruderRegistration() {
            window.closeModal();
            const s = currentUserConfig.start || 1, e = currentUserConfig.end || 300;
            let found = null;
            for(let i = s; i <= e; i++) {
                const c = "INV" + String(i).padStart(3, '0');
                if (!records.some(r => r.location === c)) { found = c; break; }
            }
            if (!found) return showAlert("RANGO LLENO", "No hay huecos INV libres.", null, 'error');
            const matMatched = getMatchedMaterial(document.getElementById('material').value);
            currentIntruderData = { ubi: found, mat: matMatched };
            document.getElementById('intruder-location-display').innerText = found;
            document.getElementById('intruder-material-display').innerText = matMatched;
            document.getElementById('intruder-qty-input').value = '';
            document.getElementById('intruder-modal-overlay').style.display = 'flex';
            setTimeout(() => document.getElementById('intruder-qty-input').focus(), 150);
        }

        document.getElementById('btn-save-intruder').onclick = () => {
            const q = parseFloat(document.getElementById('intruder-qty-input').value);
            if (isNaN(q)) return;
            window.closeIntruderModal();
            pendingSaveData = { id: Date.now(), date: new Date().toLocaleDateString(), time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), user: auth.currentUser.email.split('@')[0].toUpperCase(), location: currentIntruderData.ubi, material: currentIntruderData.mat, qty: q, theoretical: 0, storage: '', doc: 'INTRUSO', status: 'INTRUSO_UBI', diff: q };
            showAlert("CONFIRMAR INTRUSO", `Asignar a: ${pendingSaveData.location}`, confirmSave, 'warning');
        };

        // --- UTILIDADES ---
        window.startCamera = async (target) => {
            if(masterData.size === 0) return;
            scanningTarget = document.getElementById(target);
            try {
                const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
                document.getElementById('video').srcObject = stream;
                document.getElementById('camera-container').style.display = 'block';
                requestAnimationFrame(scanFrame);
            } catch(e) {}
        };
        function scanFrame() {
            const v = document.getElementById('video');
            if (v.srcObject && barcodeDetector && v.readyState === v.HAVE_ENOUGH_DATA) {
                barcodeDetector.detect(v).then(codes => {
                    if (codes.length > 0) {
                        const code = codes[0].rawValue.trim().toUpperCase();
                        scanningTarget.value = code; stopCamera(); playSound('beep');
                        if (scanningTarget.id === 'location') { if(window.checkLocation(code)) document.getElementById('material').focus(); }
                        else { window.verifyMaterialBeforeQty(() => document.getElementById('qty').focus()); }
                    }
                });
            }
            if (document.getElementById('camera-container').style.display !== 'none') requestAnimationFrame(scanFrame);
        }
        window.stopCamera = () => { const v = document.getElementById('video'); if (v.srcObject) v.srcObject.getTracks().forEach(t => t.stop()); document.getElementById('camera-container').style.display = 'none'; };

        function updateStatsUI() {
            const p = document.getElementById('progress-percent');
            if (p && masterData.size > 0) {
                const counted = new Set(records.filter(r => !r.location.startsWith("INV")).map(r => r.location)).size;
                p.innerText = Math.round((counted / masterData.size) * 100) + "%";
            }
        }
        function renderTable() {
            const b = document.getElementById('records-body');
            document.getElementById('count-badge').innerText = records.length;
            const isAdmin = auth.currentUser?.email === ADMIN_EMAIL;
            b.innerHTML = (isAdmin ? records : records.slice(0, 100)).map(r => `<tr><td>${r.date} ${r.time}</td><td><b>${r.location}</b></td><td>${r.material}</td><td>${r.qty}</td><td>${r.user}</td><td><span class="status-badge ${r.status==='OK'?'bg-ok':(r.status==='VACIO'?'bg-empty':'bg-err')}">${r.status}</span></td><td class="adm-only">${isAdmin ? `<button class="btn-delete" onclick="deleteRecord('${r.firebaseId}')">🗑️</button>` : ''}</td></tr>`).join('');
            if(isAdmin) document.querySelectorAll('.adm-only').forEach(el => el.style.display = 'flex');
            updateStatsUI();
        }
        function renderUserSummary() {
            const b = document.getElementById('user-summary-body'); if(!b) return;
            const s = new Map();
            records.forEach(r => { if(!s.has(r.user)) s.set(r.user, { u: 0, q: 0 }); const v = s.get(r.user); v.u++; v.q += (r.qty || 0); });
            b.innerHTML = Array.from(s.entries()).map(([u, v]) => `<tr><td>${u}</td><td>${(userConfigs.get(u.toLowerCase()+"@grupocargo.com")||{}).zone || '-'}</td><td>${v.u}</td><td>${v.q}</td></tr>`).join('');
        }
        window.exportCSV = () => {
            let csv = "Fecha,Hora,Usuario,Ubicacion,Material,Doc_Inventario,Storage,Theoretical,Qty,Diff,Status\n";
            records.forEach(r => csv += `${r.date},${r.time},${r.user},${r.location},${r.material},${r.doc},${r.storage},${r.theoretical},${r.qty},${r.diff},${r.status}\n`);
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'})); a.download = `Inventario_${Date.now()}.csv`; a.click();
        };
        function showAlert(title, msg, confirmCb, theme = 'warning', intruderCb = null) {
            const box = document.getElementById('modal-box'), btnC = document.getElementById('modal-confirm-btn'), btnI = document.getElementById('modal-intruder-btn'), btnX = document.getElementById('modal-cancel-btn'), btnO = document.getElementById('modal-ok-btn');
            document.getElementById('modal-title').innerText = title; document.getElementById('modal-msg').innerText = msg;
            box.className = 'modal-box ' + theme + '-mode'; document.getElementById('modal-icon').innerText = theme === 'error' ? '⛔' : (theme === 'success' ? '✅' : '⚠️');
            if(!confirmCb && !intruderCb) { btnC.style.display = btnI.style.display = btnX.style.display = 'none'; btnO.style.display = 'block'; }
            else if (confirmCb && !intruderCb) { btnO.style.display = btnI.style.display = 'none'; btnX.style.display = btnC.style.display = 'block'; btnC.innerText = "CONFIRMAR"; btnC.className = theme === 'success' ? 'modal-btn confirm-ok' : 'modal-btn danger'; btnC.onclick = confirmCb; }
            else { btnO.style.display = 'none'; btnX.style.display = btnC.style.display = btnI.style.display = 'block'; btnC.innerText = "GUARDAR"; btnC.onclick = () => { confirmCb(); window.closeModal(); }; btnI.onclick = intruderCb; }
            if (typeof confirmCb === 'function' && !intruderCb && (theme === 'error' || theme === 'success')) btnO.onclick = () => { confirmCb(); window.closeModal(); };
            document.getElementById('modal-overlay').style.display = 'flex';
        }
        function playSound(t) {
            const c=new AudioContext(), o=c.createOscillator(), g=c.createGain(); o.connect(g); g.connect(c.destination);
            if(t==='error'){ o.type='sawtooth'; o.frequency.value=150; g.gain.value=0.1; o.start(); o.stop(c.currentTime+0.2); }
            else{ o.frequency.value=800; g.gain.value=0.05; o.start(); o.stop(c.currentTime+0.1); }
        }

        // --- GESTOS ---
        let tx = 0, ty = 0;
        document.addEventListener('touchstart', e => { tx = e.changedTouches[0].screenX; ty = e.changedTouches[0].screenY; }, {passive: true});
        document.addEventListener('touchend', e => {
            const dx = tx - e.changedTouches[0].screenX, dy = ty - e.changedTouches[0].screenY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 100) {
                const isAdmin = auth.currentUser?.email === ADMIN_EMAIL, active = document.querySelector('.tab-btn.active').id;
                if (dx > 0) { if (active === 'tab-conteo') window.switchView('historial'); else if (active === 'tab-historial' && isAdmin) window.switchView('config'); }
                else { if (active === 'tab-config') window.switchView('historial'); else if (active === 'tab-historial') window.switchView('conteo'); }
            }
        }, {passive: true});

        document.getElementById('location').addEventListener('keydown', e => { if(e.key === 'Enter') if(window.checkLocation(e.target.value.toUpperCase())) document.getElementById('material').focus(); });
        document.getElementById('material').addEventListener('keydown', e => { if(e.key === 'Enter') window.verifyMaterialBeforeQty(() => document.getElementById('qty').focus()); });
        document.getElementById('qty').addEventListener('keydown', e => { if(e.key === 'Enter') window.validateAndSave(); });

        document.addEventListener('DOMContentLoaded', async () => {
            await initAuth();
            const manifest = { "name": "Inventario Cargo", "short_name": "InvCargo", "start_url": ".", "display": "standalone", "orientation": "portrait", "background_color": "#0D2334", "theme_color": "#0D2334", "icons": [{ "src": "logo.png", "sizes": "192x192", "type": "image/png" }, { "src": "logo.png", "sizes": "512x512", "type": "image/png" }] };
            const link = document.createElement('link'); link.rel = 'manifest'; link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: 'application/json'})); document.head.appendChild(link);
            
            // Inyección de Service Worker dinámico para habilitar INSTALACIÓN PWA
            const swCode = `self.addEventListener('fetch', function(event) { event.respondWith(fetch(event.request)); });`;
            const swBlob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(swBlob);
            if ('serviceWorker' in navigator) navigator.serviceWorker.register(swUrl).catch(() => {});
        });
    </script>
</body>
</html>
