<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0D2334">
    
    <!-- Configuración para App de Pantalla Completa (PWA Mode) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Inventario Cargo">
    
    <!-- Iconos para la Pantalla de Inicio (Usando tu archivo local logo.png) -->
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    
    <title>Inventario Pro - V31.2</title>
    <style>
        /* --- ESTILOS VISUALES --- */
        :root {
            --navy-main: #0D2334;
            --red-accent: #D70F27;
            --bg-body: #F4F6F9;
            --bg-card: #FFFFFF;
            --text-main: #0D2334;
            --text-muted: #64748B;
            --input-bg: #E2E8F0;
            --input-text: #0D2334;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 40px;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
        }

        /* --- PANTALLA DE LOGIN --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--navy-main);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000; padding: 20px;
        }
        .login-box {
            background: white; width: 100%; max-width: 340px; border-radius: 16px;
            padding: 30px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .login-logo {
            width: 120px;
            height: auto;
            margin-bottom: 15px;
            border-radius: 12px;
        }
        .login-box h2 { color: var(--navy-main); margin-bottom: 5px; font-weight: 800; }
        .version-tag { font-size: 10px; color: var(--text-muted); margin-bottom: 20px; display: block; }
        
        /* --- CABECERA --- */
        header {
            background-color: var(--navy-main);
            color: white;
            padding: 10px 16px 0 16px;
            padding-top: calc(10px + env(safe-area-inset-top)); 
            box-shadow: 0 4px 12px rgba(13,35,52,0.2);
            position: sticky; top: 0; z-index: 100;
        }
        .header-top {
            display: grid; grid-template-columns: 80px 1fr 60px;
            align-items: center; margin-bottom: 10px;
        }
        .logout-btn {
            background: rgba(255,255,255,0.15); border: none; color: white;
            font-size: 11px; padding: 6px 10px; border-radius: 6px; cursor: pointer;
        }
        h1 { margin: 0; font-size: 16px; text-align: center; font-weight: 700; }
        
        .header-btn-upload {
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
            color: white; border-radius: 8px; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer; justify-self: end;
        }

        /* --- PESTAÑAS --- */
        .tabs { display: flex; gap: 20px; justify-content: center; }
        .tab-btn {
            background: transparent; border: none; color: rgba(255, 255, 255, 0.6);
            font-size: 14px; padding-bottom: 10px; cursor: pointer; flex: 1; text-align: center;
        }
        .tab-btn.active { color: white; font-weight: 700; border-bottom: 3px solid var(--red-accent); }

        /* --- CONTENEDORES --- */
        .container { padding: 16px; max-width: 600px; margin: 0 auto; }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--bg-card); border-radius: 12px; padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 12px;
        }

        /* --- INPUTS --- */
        label {
            display: block; font-size: 10px; font-weight: 700; color: var(--navy-main);
            margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        input {
            width: 100%; padding: 12px; font-size: 16px; border: none; border-radius: 8px;
            background-color: var(--input-bg); color: var(--input-text); margin-bottom: 15px;
        }
        input:focus { background-color: #fff; box-shadow: 0 0 0 2px var(--navy-main); }
        input:disabled { background-color: #CBD5E1; color: #64748B; opacity: 0.8; }
        
        .input-wrapper { position: relative; }
        .input-action-btn {
            position: absolute; right: 4px; top: 18px; width: 40px; height: 40px;
            background: var(--navy-main); color: white; border: none; border-radius: 6px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        /* --- BOTONES --- */
        .btn {
            width: 100%; padding: 14px; border-radius: 8px; border: none;
            font-size: 14px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-primary { background-color: var(--red-accent); color: white; }
        .btn-secondary { background-color: var(--input-bg); color: var(--navy-main); }
        .btn-danger-block { background-color: var(--danger); color: white; }
        .btn-lock {
            background: var(--navy-main); color: white; border: none; border-radius: 8px;
            width: 100%; height: 100%; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .btn-lock.locked { background: var(--success); }
        .btn-delete {
            background: #FEE2E2; color: #991B1B; border: none; border-radius: 6px;
            width: 30px; height: 30px; cursor: pointer;
        }

        /* --- TABLA --- */
        .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 600px; }
        th { background: var(--navy-main); color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; white-space: nowrap; }
        
        .status-badge { padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 800; text-transform: uppercase; }
        .bg-ok { background: #DCFCE7; color: #166534; }
        .bg-err { background: #FEE2E2; color: #991B1B; }
        .bg-empty { background: #F1F5F9; color: #64748B; border: 1px solid #CBD5E1; }

        /* --- MODALES --- */
        #modal-overlay, #intruder-modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 35, 52, 0.85); z-index: 1000;
            align-items: center; justify-content: center;
        }
        .modal-box {
            background: white; width: 90%; max-width: 320px; border-radius: 12px;
            padding: 20px; text-align: center;
        }
        .modal-box.error-mode { border: 4px solid var(--danger); }
        .modal-title { font-size: 16px; font-weight: 800; margin-bottom: 10px; color: var(--navy-main); }
        .error-mode .modal-title { color: var(--danger); }
        .modal-msg { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }
        
        .modal-btn { width: 100%; padding: 12px; border-radius: 6px; font-weight: 700; border: none; cursor: pointer; margin-top: 8px; }
        .modal-btn.danger { background: var(--red-accent); color: white; }
        .modal-btn.intruder { background: var(--warning); color: white; }
        .modal-btn.cancel { background: var(--input-bg); color: var(--navy-main); }

        /* --- CÁMARA --- */
        #camera-container {
            display: none; position: relative; margin-bottom: 10px; border-radius: 8px;
            overflow: hidden; background: black; border: 2px solid var(--red-accent);
        }
        video { width: 100%; display: block; }
        .camera-overlay {
            position: absolute; bottom: 10px; left: 0; right: 0; text-align: center;
            color: white; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        .adm-only { display: none; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-box">
            <!-- Imagen del Logo (Subir logo.png a tu repo de GitHub) -->
            <img src="logo.png" alt="Logo Grupo Cargo" class="login-logo" onerror="this.style.display='none'">
            
            <h2>GRUPO CARGO</h2>
            <span class="version-tag">SISTEMA INVENTARIO V31.2</span>
            <input type="text" id="login-user" placeholder="Usuario (ej: luciano)">
            <input type="password" id="login-pass" placeholder="Contraseña">
            <button class="btn btn-primary" onclick="loginUsuario()">INGRESAR</button>
        </div>
    </div>

    <!-- 2. APLICACIÓN PRINCIPAL -->
    <header id="main-header" style="display:none;">
        <div class="header-top">
            <button class="logout-btn" onclick="logout()">SALIR</button>
            <h1>Inventario Cargo</h1>
            <button class="header-btn-upload adm-only" id="btn-cloud-master" onclick="downloadMasterFromCloud()" title="Descargar Maestro">☁️</button>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchView('conteo')">CONTEO</button>
            <button class="tab-btn" onclick="switchView('historial')">HISTORIAL (<span id="count-badge">0</span>)</button>
        </div>
    </header>

    <div id="view-conteo" class="view active container">
        <div id="master-alert-box" style="background:#FEF2F2; border:1px solid #FECACA; color:#991B1B; padding:10px; border-radius:8px; font-size:12px; margin-bottom:10px; display:flex; align-items:center; gap:10px;">
            <span>⚠️</span> <div><strong>ATENCIÓN:</strong> El maestro no está cargado.</div>
        </div>
        <div id="master-success-box" style="display:none; background:#DCFCE7; border:1px solid #86EFAC; color:#166534; padding:10px; border-radius:8px; font-size:12px; margin-bottom:10px; align-items:center; gap:10px;">
            <span>✅</span> <div id="master-info-text">Maestro activo.</div>
        </div>

        <div class="card">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div>
                    <label>Usuario</label>
                    <input type="text" id="user-display" disabled style="font-weight:bold; background:#F1F5F9;">
                </div>
                <div>
                    <label>Zona</label>
                    <input type="text" id="zone-filter" placeholder="Ej: A1" maxlength="3" style="text-transform:uppercase;">
                </div>
            </div>
            
            <div class="adm-only" style="margin-top:10px;">
                <label>Rango Intrusos</label>
                <div style="display:grid; grid-template-columns: 1fr 1fr 60px; gap:8px;">
                    <input type="number" id="intruder-start" value="1">
                    <input type="number" id="intruder-end" value="300">
                    <button id="btn-lock-range" class="btn-lock" onclick="toggleRangeLock()">🔓</button>
                </div>
            </div>
        </div>

        <div id="camera-container">
            <video id="video" playsinline muted autoplay></video>
            <div class="camera-overlay">ESCANEANDO...</div>
        </div>
        <input type="file" id="scan-fallback" accept="image/*" capture="environment" hidden>

        <div class="card">
            <div class="input-wrapper">
                <label>Ubicación</label>
                <input type="text" id="location" placeholder="Escanear ubicación">
                <button class="input-action-btn" onclick="startCamera('location')">📷</button>
            </div>
            <div class="input-wrapper">
                <label>Material</label>
                <input type="text" id="material" placeholder="Escanear material">
                <button class="input-action-btn" onclick="startCamera('material')">📷</button>
            </div>
            <div class="input-wrapper">
                <label>Cantidad</label>
                <input type="number" id="qty" placeholder="0" inputmode="numeric">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
                <button class="btn btn-secondary" onclick="clearForm()">LIMPIAR</button>
                <button class="btn btn-primary" onclick="validateAndSave()">GUARDAR</button>
            </div>
        </div>
    </div>

    <div id="view-historial" class="view container">
        <div class="card adm-only" style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px;">
            <button class="btn btn-secondary" onclick="exportCSV()" style="font-size:10px;">CSV</button>
            <button class="btn btn-secondary" onclick="window.location.reload()" style="font-size:10px;">REFRESCAR</button>
            <button class="btn btn-danger-block" onclick="resetAllProtected()" style="font-size:10px;">BORRAR TODO</button>
        </div>
        <div class="card" style="padding: 0; overflow: hidden;">
            <div class="table-wrap">
                <table id="records-table">
                    <thead>
                        <tr><th>Fecha</th><th>Ubi</th><th>Mat</th><th>Cant</th><th>User</th><th>Est</th><th class="adm-only"></th></tr>
                    </thead>
                    <tbody id="records-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL INTRUSO -->
    <div id="intruder-modal-overlay">
        <div class="modal-box">
            <div class="modal-title">REGISTRAR INTRUSO</div>
            <div id="intruder-location-display" style="font-size: 24px; font-weight: 900; color: #D70F27; margin: 10px 0;"></div>
            <div style="font-size: 14px; margin-bottom: 5px;">Material: <span id="intruder-material-display" style="font-weight:bold;"></span></div>
            <input type="number" id="intruder-qty-input" placeholder="Cantidad" style="margin-bottom: 15px; text-align: center;">
            <button class="btn btn-primary" id="btn-save-intruder">GUARDAR</button>
            <button class="btn btn-secondary" onclick="closeIntruderModal()">CANCELAR</button>
        </div>
    </div>

    <!-- LÓGICA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
        import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-storage.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

        // --- CONFIGURACIÓN DE PROYECTO ---
        const firebaseConfig = {
            apiKey: "AIzaSyDI2_dfJ5WbGCoddHPaXg40yrxEZqB4ZXI",
            authDomain: "inventarioapp-cddbe.firebaseapp.com",
            projectId: "inventarioapp-cddbe",
            storageBucket: "inventarioapp-cddbe.firebasestorage.app",
            messagingSenderId: "1091506863615",
            appId: "1:1091506863615:web:8b3f1fff3bca138b337bca"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const auth = getAuth(app);

        // Variables Globales
        const ADMIN_EMAIL = "lvilla@grupocargo.com";
        let masterData = new Map();
        let MASTER_CODES = new Set();
        let records = [];
        let intruderConfig = JSON.parse(localStorage.getItem('inv_config_v31')) || { start: 1, end: 300, locked: false };
        let barcodeDetector = null;
        let scanningTarget = null;
        let currentIntruderData = null;

        // Inicialización Barcode
        if ('BarcodeDetector' in window) {
            barcodeDetector = new BarcodeDetector({formats: ['code_128','code_39','ean_13']});
        }

        // --- AUTHENTICATION ---
        window.loginUsuario = async () => {
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            if (!user || !pass) return alert("Ingrese credenciales");
            const email = user.includes('@') ? user : `${user.toLowerCase()}@grupocargo.com`;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                console.error("Error Login:", e);
                if (e.code === 'auth/api-key-not-valid') {
                    alert("ERROR CRÍTICO: La clave API fue rechazada.");
                } else {
                    alert("Error: " + e.code);
                }
            }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-header').style.display = 'block';
                document.getElementById('view-conteo').classList.add('active');
                document.getElementById('user-display').value = user.email.split('@')[0].toUpperCase();
                const isAdmin = user.email === ADMIN_EMAIL;
                document.querySelectorAll('.adm-only').forEach(el => el.style.display = isAdmin ? 'grid' : 'none');
                initRealtimeSync();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('main-header').style.display = 'none';
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            }
        });

        function initRealtimeSync() {
            onSnapshot(collection(db, "conteos"), (snap) => {
                records = [];
                snap.forEach(d => records.push({ firebaseId: d.id, ...d.data() }));
                records.sort((a, b) => b.id - a.id);
                renderTable();
            });
        }

        // --- MAESTRO ---
        window.downloadMasterFromCloud = async () => {
            const btn = document.getElementById('btn-cloud-master');
            btn.innerHTML = "⏳";
            try {
                const url = await getDownloadURL(ref(storage, 'maestro.csv'));
                const res = await fetch(url);
                const text = await res.text();
                processMasterData(text);
                btn.innerHTML = "✅";
            } catch (e) {
                alert("Error maestro: " + e.message);
                btn.innerHTML = "☁️";
            }
        };

        function processMasterData(csvText) {
            const lines = csvText.split(/\r\n|\n/);
            masterData.clear();
            MASTER_CODES.clear();
            const sep = lines[0].indexOf(';') > -1 ? ';' : ',';
            let count = 0;
            lines.forEach(l => {
                if (!l.trim()) return;
                const c = l.split(sep).map(x => x.trim().toUpperCase());
                if (c.length >= 2 && c[0]) {
                    const entry = { mat: c[1], stock: parseFloat(c[2]) || 0, storage: c[3]||'', doc: c[4]||'' };
                    if (masterData.has(c[0])) masterData.get(c[0]).push(entry);
                    else masterData.set(c[0], [entry]);
                    MASTER_CODES.add(c[1]);
                    count++;
                }
            });
            try { localStorage.setItem('inv_master_v31', JSON.stringify(Array.from(masterData.entries()))); } catch(e){}
            updateMasterUI(count);
        }

        function loadLocalMaster() {
            const stored = localStorage.getItem('inv_master_v31');
            if (stored) {
                masterData = new Map(JSON.parse(stored));
                MASTER_CODES.clear();
                for (let [u, items] of masterData) items.forEach(i => MASTER_CODES.add(i.mat));
                updateMasterUI();
            }
        }

        function updateMasterUI(c) {
            const count = c || Array.from(masterData.values()).flat().length;
            if (count > 0) {
                document.getElementById('master-alert-box').style.display = 'none';
                document.getElementById('master-success-box').style.display = 'flex';
                document.getElementById('master-info-text').innerText = `Maestro activo: ${count} registros.`;
            }
        }

        // --- LOGICA DE FORMULARIO ---
        window.validateAndSave = async () => {
            if (masterData.size === 0) return alert("Cargue el maestro.");
            const ubi = document.getElementById('location').value.trim().toUpperCase();
            const mat = document.getElementById('material').value.trim().toUpperCase();
            const qty = parseFloat(document.getElementById('qty').value);
            if (!ubi || !mat || isNaN(qty)) return alert("Faltan datos.");
            
            if (records.some(r => r.location === ubi)) return alert("Ubicación ya contada.");
            const zone = document.getElementById('zone-filter').value.toUpperCase();
            if (zone && !ubi.startsWith(zone)) return alert("Zona incorrecta.");

            let status = 'OK', theoretical = 0, diff = 0, finalMat = mat;

            if (ubi.startsWith("INV")) {
                status = 'INTRUSO_UBI';
            } else {
                const list = masterData.get(ubi);
                if (!list) { status = 'ERROR'; diff = qty; }
                else {
                    const match = list.find(m => matchMaterial(mat, m.mat));
                    if (match) { finalMat = match.mat; theoretical = match.stock; diff = qty - theoretical; }
                    else {
                        status = 'INTRUSO_MAT';
                        playSound('error');
                        const expectedStr = list.map(m => m.mat).join(" O ");
                        if(confirm(`Material Inesperado. Esperado: ${expectedStr}. ¿Asignar como Intruso?`)) {
                             handleIntruder(ubi, mat, qty); return;
                        }
                        return;
                    }
                }
            }

            const record = { id: Date.now(), date: new Date().toLocaleDateString(), user: auth.currentUser.email.split('@')[0].toUpperCase(), location: ubi, material: finalMat, qty, theoretical, status, diff };
            await addDoc(collection(db, "conteos"), record);
            playSound('success');
            clearForm();
        };

        function matchMaterial(scan, target) {
            return scan.substring(0,9) === target.substring(0,9);
        }

        function handleIntruder(ubi, mat, qty) {
            const start = parseInt(document.getElementById('intruder-start').value);
            const end = parseInt(document.getElementById('intruder-end').value);
            let found = null;
            for(let i = start; i <= end; i++) {
                const cand = "INV" + String(i).padStart(3, '0');
                if (!records.some(r => r.location === cand)) { found = cand; break; }
            }
            if (!found) return alert("Sin huecos INV.");
            currentIntruderData = { ubi: found, mat, user: auth.currentUser.email.split('@')[0].toUpperCase() };
            document.getElementById('intruder-location-display').innerText = found;
            document.getElementById('intruder-material-display').innerText = mat;
            document.getElementById('intruder-modal-overlay').style.display = 'flex';
        }

        window.closeIntruderModal = () => document.getElementById('intruder-modal-overlay').style.display = 'none';

        document.getElementById('btn-save-intruder').onclick = async () => {
            const qty = parseFloat(document.getElementById('intruder-qty-input').value);
            if (isNaN(qty)) return alert("Cantidad inválida");
            const record = { id: Date.now(), date: new Date().toLocaleDateString(), user: currentIntruderData.user, location: currentIntruderData.ubi, material: currentIntruderData.mat, qty, theoretical: 0, status: 'INTRUSO_UBI', diff: qty };
            await addDoc(collection(db, "conteos"), record);
            closeIntruderModal();
            clearForm();
        };

        // --- CÁMARA ---
        window.startCamera = async (target) => {
            scanningTarget = document.getElementById(target);
            try {
                const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
                document.getElementById('video').srcObject = stream;
                document.getElementById('camera-container').style.display = 'block';
                requestAnimationFrame(scanFrame);
            } catch(e) { document.getElementById('scan-fallback').click(); }
        };

        function scanFrame() {
            if (document.getElementById('camera-container').style.display === 'none') return;
            const vid = document.getElementById('video');
            if (barcodeDetector && vid.readyState === vid.HAVE_ENOUGH_DATA) {
                barcodeDetector.detect(vid).then(codes => {
                    if (codes.length > 0) {
                        scanningTarget.value = codes[0].rawValue;
                        stopCamera();
                        playSound('beep');
                        if (scanningTarget.id === 'location') document.getElementById('material').focus();
                        else document.getElementById('qty').focus();
                    }
                });
            }
            requestAnimationFrame(scanFrame);
        }

        window.stopCamera = () => {
            const vid = document.getElementById('video');
            if (vid.srcObject) vid.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('camera-container').style.display = 'none';
        };

        // --- UTILIDADES ---
        function clearForm() { 
            document.getElementById('location').value = ''; 
            document.getElementById('material').value = ''; 
            document.getElementById('qty').value = ''; 
            document.getElementById('location').focus(); 
        }
        function playSound(t) {
            const c=new(window.AudioContext||window.webkitAudioContext), o=c.createOscillator(), g=c.createGain();
            o.connect(g); g.connect(c.destination);
            if(t==='error'){ o.type='sawtooth'; o.frequency.value=150; g.gain.value=0.2; o.start(); o.stop(c.currentTime+0.3); }
            else{ o.frequency.value=800; g.gain.value=0.1; o.start(); o.stop(c.currentTime+0.1); }
        }
        window.switchView = (v) => {
            document.querySelectorAll('.view').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
            document.getElementById(`view-${v}`).classList.add('active');
            document.querySelector(`[onclick="switchView('${v}')"]`).classList.add('active');
        };
        function renderTable() {
            const body = document.getElementById('records-body');
            document.getElementById('count-badge').innerText = records.length;
            body.innerHTML = records.map(r => `<tr><td>${r.date}</td><td><b>${r.location}</b></td><td>${r.material}</td><td>${r.qty}</td><td>${r.user}</td><td><span class="status-badge ${r.status==='OK'?'bg-ok':'bg-err'}">${r.status}</span></td></tr>`).join('');
        }
        window.toggleRangeLock = () => {
            intruderConfig.locked = !intruderConfig.locked;
            localStorage.setItem('inv_config_v31', JSON.stringify(intruderConfig));
            document.getElementById('intruder-start').disabled = intruderConfig.locked;
            document.getElementById('intruder-end').disabled = intruderConfig.locked;
            document.getElementById('btn-lock-range').innerText = intruderConfig.locked ? '🔒' : '🔓';
        };

        function setupAutoAdvance(id, nextId) {
            document.getElementById(id).addEventListener('keydown', e => {
                if(e.key === 'Enter') document.getElementById(nextId).focus();
            });
        }

        window.exportCSV = () => {
            let csv = "Fecha,Ubicacion,Material,Cantidad,Usuario,Estado\n";
            records.forEach(r => csv += `${r.date},${r.location},${r.material},${r.qty},${r.user},${r.status}\n`);
            const blob = new Blob([csv], {type: 'text/csv'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'inv.csv'; a.click();
        };

        document.addEventListener('DOMContentLoaded', () => {
            loadLocalMaster();
            setupAutoAdvance('location', 'material');
            setupAutoAdvance('material', 'qty');

            // Manifest dinámico actualizado para usar logo.png
            const manifest = {
                "name": "Inventario Cargo",
                "short_name": "InvCargo",
                "start_url": ".",
                "display": "standalone",
                "background_color": "#0D2334",
                "theme_color": "#0D2334",
                "icons": [
                    { "src": "logo.png", "sizes": "192x192", "type": "image/png" },
                    { "src": "logo.png", "sizes": "512x512", "type": "image/png" }
                ]
            };
            const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);
        });
    </script>
</body>
</html>
